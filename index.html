<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e0b56a" />
  <title>Kustlanden</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>
  <div id="table">
    <aside id="north" class="rail ns"></aside>
    <aside id="west" class="rail ew"></aside>
    <div id="boardStage">
      <canvas id="board" width="720" height="720"></canvas>
      <div id="boardTools">
        <span class="dot" id="turnDot"></span>
        <div class="who"><b id="status">Laden…</b><small id="hint"></small></div>
        <span class="die" id="dieA">?</span>
        <span class="die" id="dieB">?</span>
        <button class="mini primary" id="roll" onclick="rollDice()">Dobbel</button>
        <button class="mini" id="end" onclick="endTurn()">Klaar</button>
        <button class="mini" onclick="toggleTray()">Bouw</button>
      </div>
    </div>
    <aside id="east" class="rail ew"></aside>
    <aside id="south" class="rail ns"></aside>
  </div>
  <div id="tray">
    <div class="row" id="modes">
      <button class="mini" id="modeAuto" onclick="setMode('auto')">Auto</button>
      <button class="mini" id="modeRoad" onclick="setMode('road')">Pad</button>
      <button class="mini" id="modeHouse" onclick="setMode('house')">Huis</button>
      <button class="mini" id="modeCity" onclick="setMode('city')">Stad</button>
      <button class="mini" id="modeShip" onclick="setMode('ship')">Boot</button>
      <button class="mini" onclick="buyDev()">Kaart</button>
    </div>
    <div class="row" id="hand"></div>
    <div class="row slim">
      <select id="fromRes" class="mini">
        <option value="hout">4 hout</option>
        <option value="steen">4 steen</option>
        <option value="graan">4 graan</option>
        <option value="wol">4 wol</option>
        <option value="erts">4 erts</option>
      </select>
      <select id="toRes" class="mini">
        <option value="hout">→ hout</option>
        <option value="steen">→ steen</option>
        <option value="graan">→ graan</option>
        <option value="wol">→ wol</option>
        <option value="erts">→ erts</option>
      </select>
      <button class="mini" onclick="tradePrompt()">Bank</button>
      <button class="mini" onclick="showHelp()">?</button>
      <button class="mini" onclick="restart()">Nieuw</button>
    </div>
  </div>
  <div id="res" hidden></div>
  <div id="players" hidden></div>
  <div id="diceFx"></div>
  <div id="modal" onclick="if(event.target.id==='modal')hideHelp()">
    <div class="box">
      <h2>Kustlanden</h2>
      <p>Spelers zitten rond de tafel. Tik het eiland in het midden.</p>
      <p>Huis 1 VP, stad 2 VP, 10 wint. Boot: hout+wol. Kaart: wol+graan+erts.</p>
      <button class="mini primary" onclick="hideHelp()">Spelen</button>
    </div>
  </div>
  <div id="lobby" class="show">
    <div class="box">
      <h2>Nieuwe partij</h2>
      <label>Spelers
        <select id="cfgCount" class="mini" onchange="syncLobby()">
          <option>2</option><option>3</option><option selected>4</option>
        </select>
      </label>
      <div id="cfgSeats"></div>
      <div class="maps" id="cfgMaps"></div>
      <button class="mini primary" onclick="startFromLobby()">Start</button>
    </div>
  </div>
  <script src="js/game.js?v=9"></script>
</body>
</html>
